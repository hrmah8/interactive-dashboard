<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYjRrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>

<body>
    <h1>My Interactive Dashboard</h1>

<p>
    This dashboard was created by HDung Rmah for the WEB-115 course at Wake Tech.
</p>

<!-- Message for browsers with JavaScript disabled -->
<noscript>
    Unfortunately, your web browser does not support JavaScript.
</noscript>

<div class="container">

    <div class="row">

        <!-- Imperial/Metric Converter -->
        <div class="col" id="metric-converter">

            <h2>Imperial/Metric Converter</h2>

            <form id="converter-form">

                <label for="input-value">Enter a value:</label>

                <input
                    type="number"
                    id="input-value"
                    step="any"
                    required
                >

                <label for="conversion-type">Choose a conversion:</label>

                <select id="conversion-type">

                    <option value="1">Inch to Centimeter</option>
                    <option value="2">Foot to Centimeter</option>
                    <option value="3">Yard to Meter</option>
                    <option value="4">Mile to Kilometer</option>
                    <option value="5">Centimeter to Inch</option>
                    <option value="6">Centimeter to Foot</option>
                    <option value="7">Meter to Yard</option>
                    <option value="8">Kilometer to Mile</option>

                </select>

                <button type="submit" id="convert-button">
                    Convert
                </button>

            </form>

            <!-- Converter output -->
            <p id="conversion-result"></p>

            <!-- Metric converter JavaScript -->
            <script src="js/metric-converter.js" defer></script>


        </div>


        <!-- Weekly Task Goals -->
        <div class="col" id="weekly-tasks">

            <h2>Weekly Task Goals</h2>

            <form id="goal-form">

                <label for="user-name">Name:</label>

                <input
                    type="text"
                    id="user-name"
                    required
                >

                <label for="daily-goal">Daily Task Goal:</label>

                <input
                    type="number"
                    id="daily-goal"
                    required
                >

                <label for="bonus-tasks">Weekly Bonus Tasks:</label>

                <input
                    type="number"
                    id="bonus-tasks"
                    required
                >

                <button type="submit" id="goal-btn">
                    Calculate Goal
                </button>

            </form>

            <!-- Weekly goal output -->
            <p id="goal-message"></p>

            <!-- Weekly task JavaScript -->
            <script src="js/task-manager.js"></script>

        </div>

    </div>

</div>
